[package]
name = "serde_markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Serde format crate: Rust structs to and from Markdown documents"
readme = "../../README.md"

[features]
default = ["yaml", "json", "toml", "derive"]
yaml = ["dep:yaml_serde"]
# JSON fence dump/load. serde_json is always linked as the fields IR.
json = []
toml = ["dep:toml"]
derive = ["dep:serde_markdown_derive"]
buffa = ["dep:buffa", "dep:buffa-types", "dep:buffa-descriptor"]
# The async twins of the functions, in the module `serde_markdown::tokio`.
tokio = ["dep:tokio"]

[dependencies]
serde_markdown_derive = { workspace = true, optional = true }
buffa = { workspace = true, optional = true }
buffa-descriptor = { workspace = true, optional = true }
buffa-types = { workspace = true, optional = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util", "rt"] }
toml = { workspace = true, optional = true }
yaml_serde = { workspace = true, optional = true }

[dev-dependencies]
serde_markdown-proto = { workspace = true }
# The tests derive `Markdown` with or without the `derive` feature.
serde_markdown_derive = { workspace = true }
buffa = { workspace = true }
buffa-descriptor = { workspace = true }
buffa-types = { workspace = true }
# The async tests build a runtime; this also puts tokio into the Bazel hub.
tokio = { workspace = true, features = ["io-util", "rt"] }

[lints]
workspace = true
