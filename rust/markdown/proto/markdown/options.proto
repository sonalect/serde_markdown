// Field option that marks a protobuf field as a Markdown body section
// for serde_markdown. Import this file from proto3, Edition 2023, or
// Edition 2024:
//
//   string text = 4 [(markdown.body) = true];
//
// The file ships inside the `serde_markdown` crate, under `proto/`, so a
// consumer reaches it through the same Cargo dependency that brings the
// library: `serde_markdown::PROTO_INCLUDE` in a build script, or a
// crate_universe annotation in Bazel (see the README).
//
// This file is proto3 so toolchains without editions can still compile it.
// A FeatureSet feature named `markdown.body` cannot coexist with this
// option: both would be the identifier `markdown.body` in package
// `markdown`.

syntax = "proto3";

package markdown;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  bool body = 20260917;
}
