[workspace]
resolver = "3"
members = [
    "rust/examples/page",
    "rust/examples/protobuf",
    "rust/examples/tokio",
    "rust/markdown",
    "rust/markdown_derive",
    "rust/proto",
]

[workspace.package]
edition = "2024"
# The oldest rustc that builds and tests the published crates (1.88: `let`
# chains); the toolchain (rust-toolchain.toml) is newer. CI checks it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/sonalect/serde_markdown"
version = "0.5.0"

[workspace.dependencies]
# Caret ranges, not `=` pins: serde_markdown and serde_markdown_derive are
# published, and an exact pin in a library conflicts with a consumer on any
# other version. Cargo.lock holds the exact versions we build and test, and
# moves only under the quarantine (.claude/rules/dependency-quarantine.md).
serde_markdown = { path = "rust/markdown" }
serde_markdown-proto = { path = "rust/proto" }
# The derive is published with the library, in lockstep: an exact version
# (the `versioning` skill moves it), as serde pins serde_derive.
serde_markdown_derive = { path = "rust/markdown_derive", version = "=0.5.0" }
buffa = { version = "0.9.2", features = ["json"] }
buffa-build = "0.9.2"
buffa-descriptor = { version = "0.9.2", default-features = false, features = [
    "std",
] }
buffa-types = { version = "0.9.2", default-features = false, features = [
    "json",
    "std",
] }
proc-macro2 = "1.0.107"
pulldown-cmark = "0.13.4"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = "3.0.9"
tokio = { version = "1.53.3", default-features = false }
toml = "1.1.8"
yaml_serde = "0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
