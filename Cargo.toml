[workspace]
resolver = "3"
members = [
    "rust/examples/page",
    "rust/examples/protobuf",
    "rust/examples/tokio",
    "rust/markdown",
    "rust/markdown_derive",
    "rust/proto",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/sonalect/serde_markdown"
version = "0.4.0"

[workspace.dependencies]
serde_markdown = { path = "rust/markdown" }
serde_markdown-proto = { path = "rust/proto" }
serde_markdown_derive = { path = "rust/markdown_derive" }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-build = "=0.9.2"
buffa-descriptor = { version = "=0.9.2", default-features = false, features = [
    "std",
] }
buffa-types = { version = "=0.9.2", default-features = false, features = [
    "json",
    "std",
] }
proc-macro2 = "=1.0.107"
pulldown-cmark = "=0.13.4"
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
syn = "=3.0.6"
tokio = { version = "=1.53.2", default-features = false }
toml = "=1.1.6"
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
