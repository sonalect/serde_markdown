[workspace]
resolver = "3"
members = [
    "rust/examples/page",
    "rust/examples/protobuf",
    "rust/generated",
    "rust/serde_markdown",
    "rust/serde_markdown_derive",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/sonalect/serde_markdown"
version = "0.1.0"

[workspace.dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-build = "=0.9.2"
buffa-types = { version = "=0.9.2", default-features = false, features = [
    "json",
    "std",
] }
buffa-descriptor = { version = "=0.9.2", default-features = false, features = [
    "std",
] }
proc-macro2 = "=1.0.107"
pulldown-cmark = "=0.13.4"
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_markdown = { path = "rust/serde_markdown" }
serde_markdown_derive = { path = "rust/serde_markdown_derive" }
serde-markdown-generated = { path = "rust/generated" }
syn = "=3.0.5"
toml = "=1.1.6"
yaml_serde = "=0.10.7"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
