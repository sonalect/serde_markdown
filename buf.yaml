# Workspace buf config (Buf LSP).
# `proto/` is the public/testdata module; imports are `markdown/options.proto`.
# `rust/examples/protobuf/proto` is the example Page (same import).
version: v2
modules:
  - path: proto
  - path: rust/examples/protobuf/proto
lint:
  use:
    - STANDARD
  except:
    # Public option package is `markdown`, not `markdown.v1`.
    - PACKAGE_VERSION_SUFFIX
    # example/page.proto would match package `example`; the file is page.proto.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
