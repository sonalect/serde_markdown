# Workspace buf config (Buf LSP).
# `rust/markdown/proto` is the public `(markdown.body)` option, shipped inside
# the crate; imports are `markdown/options.proto`.
# `proto/` is the testdata module; `rust/examples/protobuf/proto` is the
# example Page (same import).
version: v2
modules:
  - path: rust/markdown/proto
  - path: proto
  - path: rust/examples/protobuf/proto
lint:
  use:
    - STANDARD
  except:
    # Public option package is `markdown`, not `markdown.v1`.
    - PACKAGE_VERSION_SUFFIX
    # example/page.proto would match package `example`; the file is page.proto.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
